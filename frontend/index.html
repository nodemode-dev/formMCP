<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>formMCP</title>
    <link rel="icon" href="/formmcp.png" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/layers.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <img class="mark" src="/formmcp.png" width="32" height="32" alt="" />
        <div class="title">
          <h1 translate="no">formMCP</h1>
          <p class="sub">One connection from Claude Code, Codex and Cursor to the Form family</p>
        </div>
        <span class="version" id="version" translate="no"></span>
      </header>
      <section class="clients" aria-label="Agent clients">
        <div class="client" data-client="claude">
          <span class="client-name" translate="no">Claude Code</span>
          <span class="client-state" data-state></span>
          <button class="btn" type="button" data-connect disabled>Connect</button>
        </div>
        <div class="client" data-client="codex">
          <span class="client-name" translate="no">Codex</span>
          <span class="client-state" data-state></span>
          <button class="btn" type="button" data-connect disabled>Connect</button>
        </div>
        <div class="client" data-client="cursor">
          <span class="client-name" translate="no">Cursor</span>
          <span class="client-state" data-state></span>
          <button class="btn" type="button" data-connect disabled>Connect</button>
        </div>
      </section>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="tools">
        <div class="chips" role="group" aria-label="Show">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="mcp" aria-pressed="false">MCP server</button>
        </div>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
      <ul class="apps" id="apps"></ul>
      <section class="log" aria-label="Activity">
        <div class="log-head">
          <span class="log-title">Activity</span>
          <span class="log-hint">Sessions, tool calls and app starts through formMCP. Arguments are never recorded.</span>
        </div>
        <ol class="log-list" id="log"></ol>
      </section>
      <footer class="foot">
        <span translate="no">by nodemode.ai</span>
        <span class="source" id="source"></span>
      </footer>
    </div>
  </body>
</html>
