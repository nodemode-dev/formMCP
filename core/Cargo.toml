[package]
name = "formmcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "formMCP's engine: the Form family list and the MCP server over stdio. No window."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.2"
ed25519-dalek = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
