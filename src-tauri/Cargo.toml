[package]
name = "formmcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "formMCP: one connection from Claude Code, Codex and Cursor to the Form family"

[lib]
name = "formmcp_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
formmcp-core = { path = "../core" }
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }
